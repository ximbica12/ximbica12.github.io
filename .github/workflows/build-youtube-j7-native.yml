name: Build YouTube J7 Native

on:
  push:
    branches: [ "yt-native-j7" ]
    paths:
      - "native-j7/**"
      - ".github/workflows/build-youtube-j7-native.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download verified build inputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p inputs dist

          # Google-signed YouTube 20.21.37, Android 8+ (API 26).
          curl -fL --retry 5 --retry-all-errors             'https://d.apkpure.net/b/APK/com.google.android.youtube?versionCode=1554771392'             -o inputs/youtube-20.21.37-stock.apk
          echo 'ddbf39fa2729f3272616ef8e55a613aa17fa7527a25f923f849b2d2c4401002a  inputs/youtube-20.21.37-stock.apk' | sha256sum -c -

          curl -fL --retry 5             'https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar'             -o inputs/morphe-desktop-1.16.0-all.jar
          echo '82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c  inputs/morphe-desktop-1.16.0-all.jar' | sha256sum -c -

      - name: Build J7-tuned patch bundle
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.44.0 https://github.com/MorpheApp/morphe-patches.git j7-patches

          SETTINGS='j7-patches/extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java'

          # J7 Prime: prefer hardware-friendly AVC/H.264 automatically.
          sed -i 's/FORCE_AVC_CODEC = new BooleanSetting("morphe_force_avc_codec", FALSE/FORCE_AVC_CODEC = new BooleanSetting("morphe_force_avc_codec", TRUE/' "$SETTINGS"

          # Aggressive SponsorBlock defaults for a clean viewing experience.
          sed -i 's/SB_CATEGORY_SPONSOR = new StringSetting("morphe_sb_sponsor", SKIP_AUTOMATICALLY_ONCE/SB_CATEGORY_SPONSOR = new StringSetting("morphe_sb_sponsor", SKIP_AUTOMATICALLY/' "$SETTINGS"
          sed -i 's/SB_CATEGORY_SELF_PROMO = new StringSetting("morphe_sb_selfpromo", MANUAL_SKIP/SB_CATEGORY_SELF_PROMO = new StringSetting("morphe_sb_selfpromo", SKIP_AUTOMATICALLY/' "$SETTINGS"
          sed -i 's/SB_CATEGORY_INTERACTION = new StringSetting("morphe_sb_interaction", MANUAL_SKIP/SB_CATEGORY_INTERACTION = new StringSetting("morphe_sb_interaction", SKIP_AUTOMATICALLY/' "$SETTINGS"

          grep -n 'FORCE_AVC_CODEC\|SB_CATEGORY_SPONSOR =\|SB_CATEGORY_SELF_PROMO =\|SB_CATEGORY_INTERACTION =' "$SETTINGS"

          cd j7-patches
          chmod +x gradlew
          ./gradlew :patches:build --no-daemon
          cd ..

          CUSTOM_MPP="$(find j7-patches/patches/build/libs -maxdepth 1 -type f -name '*.mpp' | head -1)"
          test -n "$CUSTOM_MPP"
          cp "$CUSTOM_MPP" inputs/patches-1.44.0-j7.mpp
          sha256sum inputs/patches-1.44.0-j7.mpp | tee inputs/PATCH_BUNDLE_SHA256.txt

      - name: Patch Android 8 ARMv7 YouTube
        shell: bash
        run: |
          set -euxo pipefail
          java -jar inputs/morphe-desktop-1.16.0-all.jar patch             -p inputs/patches-1.44.0-j7.mpp             -o dist/YouTube-J7-Native-v0.2.1.apk             --exclusive             --striplibs armeabi-v7a             -e 'Hide ads'             -e 'SponsorBlock'             -e 'GmsCore support'             -e 'Spoof video streams'             -e 'Disable QUIC protocol'             -e 'Disable video codecs'             -e 'Video quality'             -e 'Remove background playback restrictions'             -e 'Return YouTube Dislike'             -e 'Sanitize sharing links'             -e 'Custom branding'             -OappIcon=play             -OcustomName=YouTube             inputs/youtube-20.21.37-stock.apk

      - name: Verify patched APK
        shell: bash
        run: |
          set -euxo pipefail
          APK='dist/YouTube-J7-Native-v0.2.1.apk'
          unzip -t "$APK" >/dev/null

          test -n "$(unzip -l "$APK" | grep 'lib/armeabi-v7a/' | head -1)"
          ! unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          ! unzip -l "$APK" | grep -q 'lib/x86/'
          ! unzip -l "$APK" | grep -q 'lib/x86_64/'

          # Confirm J7 defaults are actually present in the injected DEX.
          unzip -p "$APK" classes*.dex | strings | grep -q 'morphe_force_avc_codec'
          unzip -p "$APK" classes*.dex | strings | grep -q 'morphe_hide_video_ads'
          unzip -p "$APK" classes*.dex | strings | grep -q 'morphe_sb_enabled'

          sha256sum "$APK" | tee dist/SHA256SUMS.txt
          stat -c '%n %s bytes' "$APK"

      - name: Bundle MicroG-RE universal
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5             'https://github.com/MorpheApp/MicroG-RE/releases/download/7.1.1/microg-7.1.1.apk'             -o dist/MicroG-RE-7.1.1-universal.apk
          echo 'ae6bbffbf9f63be1328c0a7ee6f39859e0921e6d222a0a3b00ba4c97e290e883  dist/MicroG-RE-7.1.1-universal.apk' | sha256sum -c -
          sha256sum dist/MicroG-RE-7.1.1-universal.apk >> dist/SHA256SUMS.txt

          printf '%s\n' \
            'YT J7 Native v0.2.1' \
            '' \
            '1. Install MicroG-RE-7.1.1-universal.apk' \
            '2. Open MicroG-RE and add your Google account if desired.' \
            '3. Install YouTube-J7-Native-v0.2.1.apk' \
            '4. Open YouTube.' \
            '' \
            'Target: Samsung J7 Prime / Android 8 / armeabi-v7a.' \
            'AVC/H.264 is enabled by default.' \
            'Sponsor, self-promotion and interaction segments auto-skip by default.' \
            > dist/INSTALL.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-J7-Native-v0.2.1
          path: |
            dist/YouTube-J7-Native-v0.2.1.apk
            dist/MicroG-RE-7.1.1-universal.apk
            dist/SHA256SUMS.txt
            dist/INSTALL.txt
          if-no-files-found: error
          retention-days: 30
