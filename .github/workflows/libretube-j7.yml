name: Build LibreTube J7

on:
  push:
    branches: [libretube-j7]
    paths:
      - 'LibreTubeJ7/**'
      - '.github/workflows/libretube-j7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout TubeLite patches
        uses: actions/checkout@v4

      - name: Clone LibreTube v32.1
        run: |
          git clone --depth 1 --branch v32.1 https://github.com/libre-tube/LibreTube.git upstream

      - name: Apply J7 patch
        run: |
          cp -R LibreTubeJ7/overlay/. upstream/
          python3 LibreTubeJ7/apply_j7_patch.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/gradle/libs.versions.toml

      - name: Build release APK
        working-directory: upstream
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect unsigned APK
        shell: bash
        run: |
          APK="$(find upstream/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" TubeLite-J7-LibreTube-v32.1-j7.2-unsigned.apk

      - name: Archive patched source
        run: |
          rm -rf upstream/.git
          zip -qr TubeLite-J7-LibreTube-v32.1-j7.2-source.zip upstream

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeLite-J7-LibreTube-APK
          path: TubeLite-J7-LibreTube-v32.1-j7.2-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: TubeLite-J7-LibreTube-Source
          path: TubeLite-J7-LibreTube-v32.1-j7.2-source.zip
          if-no-files-found: error
          retention-days: 30
