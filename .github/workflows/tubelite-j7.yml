name: Build TubeLite J7

on:
  push:
    branches: [tubelite-j7]
    paths:
      - 'TubeLiteJ7/**'
      - '.github/workflows/tubelite-j7.yml'
  pull_request:
    branches: [main]
    paths:
      - 'TubeLiteJ7/**'
      - '.github/workflows/tubelite-j7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: TubeLiteJ7
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp TubeLiteJ7/app/build/outputs/apk/debug/app-debug.apk TubeLite-J7-Android8-armeabi-v7a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeLite-J7-APK
          path: TubeLite-J7-Android8-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30
