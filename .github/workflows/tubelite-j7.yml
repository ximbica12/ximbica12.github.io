name: Build TubeLite J7

on:
  push:
    branches: [tubelite-j7]
    paths:
      - 'TubeLiteJ7/**'
      - '.github/workflows/tubelite-j7.yml'
  pull_request:
    branches: [main]
    paths:
      - 'TubeLiteJ7/**'
      - '.github/workflows/tubelite-j7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: TubeLiteJ7
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp TubeLiteJ7/app/build/outputs/apk/debug/app-debug.apk TubeLite-J7-Android8-armeabi-v7a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeLite-J7-APK
          path: TubeLite-J7-Android8-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30
