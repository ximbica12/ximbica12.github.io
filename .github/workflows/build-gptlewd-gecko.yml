name: Build GPTLewd Gecko J7

on:
  push:
    branches: [gptlewd-web]
    paths:
      - 'gptlewd-gecko/**'
      - 'gptlewd-web/icon-src/icon.b64'
      - '.github/workflows/build-gptlewd-gecko.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Generate Android launcher icon from user image
        run: |
          set -euxo pipefail
          mkdir -p build/icon
          base64 -d gptlewd-web/icon-src/icon.b64 > build/icon/source.jpg
          identify build/icon/source.jpg
          convert build/icon/source.jpg -auto-orient -gravity center -resize 512x512^ -extent 512x512 build/icon/master.png

          mkdir -p gptlewd-gecko/app/src/main/res/mipmap-mdpi
          mkdir -p gptlewd-gecko/app/src/main/res/mipmap-hdpi
          mkdir -p gptlewd-gecko/app/src/main/res/mipmap-xhdpi
          mkdir -p gptlewd-gecko/app/src/main/res/mipmap-xxhdpi
          mkdir -p gptlewd-gecko/app/src/main/res/mipmap-xxxhdpi

          convert build/icon/master.png -resize 48x48 gptlewd-gecko/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert build/icon/master.png -resize 72x72 gptlewd-gecko/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert build/icon/master.png -resize 96x96 gptlewd-gecko/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert build/icon/master.png -resize 144x144 gptlewd-gecko/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert build/icon/master.png -resize 192x192 gptlewd-gecko/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build debug APK
        working-directory: gptlewd-gecko
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contents
        run: |
          set -eux
          APK=gptlewd-gecko/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -E 'lib/armeabi-v7a/|res/'
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/'; then
            echo "Unexpected arm64 library in ARMv7 build"
            exit 1
          fi
          sha256sum "$APK" | tee gptlewd-gecko/app-debug.sha256
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPTLewd-Gecko-J7-alpha1
          path: |
            gptlewd-gecko/app/build/outputs/apk/debug/app-debug.apk
            gptlewd-gecko/app-debug.sha256
          if-no-files-found: error
          retention-days: 30
