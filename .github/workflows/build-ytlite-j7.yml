name: Build YT Lite J7

on:
  push:
    branches: [ "ytlite-j7" ]
    paths:
      - "ytlite-j7/**"
      - ".github/workflows/build-ytlite-j7.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Bundle uBlock Origin and SponsorBlock
        run: |
          set -euxo pipefail
          UBO_DIR="ytlite-j7/app/src/main/assets/extensions/ublock"
          SB_DIR="ytlite-j7/app/src/main/assets/extensions/sponsorblock"
          rm -rf "$UBO_DIR" "$SB_DIR"
          mkdir -p "$UBO_DIR" "$SB_DIR"

          curl -fL --retry 4             "https://github.com/gorhill/uBlock/releases/download/1.75.0/uBlock0_1.75.0.firefox.signed.xpi"             -o /tmp/ublock.xpi
          unzip -q /tmp/ublock.xpi -d "$UBO_DIR"

          curl -fL --retry 4             "https://github.com/ajayyy/SponsorBlock/releases/download/6.1.7/FirefoxExtension.zip"             -o /tmp/sponsorblock.zip
          unzip -q /tmp/sponsorblock.zip -d "$SB_DIR"

          test -f "$UBO_DIR/manifest.json"
          test -f "$SB_DIR/manifest.json"

      - name: Build APK
        working-directory: ytlite-j7
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/YT-Lite-J7-v0.1.0.apk
          sha256sum app/build/outputs/apk/debug/YT-Lite-J7-v0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-Lite-J7-v0.1.0
          path: ytlite-j7/app/build/outputs/apk/debug/YT-Lite-J7-v0.1.0.apk
          if-no-files-found: error
          retention-days: 30
