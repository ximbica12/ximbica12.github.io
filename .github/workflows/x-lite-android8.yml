name: Build X Lite Android 8 WebView

on:
  push:
    branches:
      - x-lite-android8
    paths:
      - "x-lite-android8/**"
      - ".github/workflows/x-lite-android8.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build signed debug APK
        working-directory: x-lite-android8
        run: gradle --no-daemon :app:assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="x-lite-android8/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt

          grep -q "package: name='com.ximbica.xlite' versionCode='3' versionName='0.3.0'" /tmp/badging.txt
          grep -q "sdkVersion:'26'" /tmp/badging.txt
          grep -q "application-icon-" /tmp/badging.txt

          if unzip -l "$APK" | grep -qE "lib/[^/]+/.*\.so$"; then
            echo "Unexpected native engine/library found in WebView build"
            unzip -l "$APK" | grep -E "lib/[^/]+/.*\.so$" || true
            exit 1
          fi

          test -f x-lite-android8/app/src/main/assets/xlite-webview.js

      - name: Prepare APK and SAI bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sai
          cp x-lite-android8/app/build/outputs/apk/debug/app-debug.apk dist/X-Lite-WebView-J7-v0.3.0.apk
          cp dist/X-Lite-WebView-J7-v0.3.0.apk dist/sai/base.apk

          python3 - <<'PY'
          import json
          import time
          from pathlib import Path

          now = int(time.time() * 1000)
          apk_size = Path("dist/sai/base.apk").stat().st_size

          meta_v1 = {
              "export_timestamp": now,
              "label": "X Lite",
              "package": "com.ximbica.xlite",
              "version_code": 3,
              "version_name": "0.3.0"
          }

          meta_v2 = {
              "backup_components": [
                  {"size": apk_size, "type": "apk_files"}
              ],
              "export_timestamp": now,
              "split_apk": False,
              "label": "X Lite",
              "meta_version": 2,
              "min_sdk": 26,
              "package": "com.ximbica.xlite",
              "target_sdk": 35,
              "version_code": 3,
              "version_name": "0.3.0"
          }

          Path("dist/sai/meta.sai_v1.json").write_text(
              json.dumps(meta_v1, separators=(",", ":")),
              encoding="utf-8"
          )
          Path("dist/sai/meta.sai_v2.json").write_text(
              json.dumps(meta_v2, separators=(",", ":")),
              encoding="utf-8"
          )
          PY

          (
            cd dist/sai
            zip -9 ../X-Lite-WebView-J7-v0.3.0.apks base.apk meta.sai_v1.json meta.sai_v2.json
          )

          sha256sum             dist/X-Lite-WebView-J7-v0.3.0.apk             dist/X-Lite-WebView-J7-v0.3.0.apks             > dist/X-Lite-WebView-J7-v0.3.0-SHA256.txt

      - name: Upload install packages
        uses: actions/upload-artifact@v4
        with:
          name: X-Lite-WebView-J7-v0.3.0
          path: |
            dist/X-Lite-WebView-J7-v0.3.0.apk
            dist/X-Lite-WebView-J7-v0.3.0.apks
            dist/X-Lite-WebView-J7-v0.3.0-SHA256.txt
          if-no-files-found: error
          retention-days: 30
