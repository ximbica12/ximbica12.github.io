name: Build X Lite Android 8

on:
  push:
    branches:
      - x-lite-android8
    paths:
      - "x-lite-android8/**"
      - ".github/workflows/x-lite-android8.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed debug APK
        working-directory: x-lite-android8
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK and SAI bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sai
          cp x-lite-android8/app/build/outputs/apk/debug/app-debug.apk dist/X-Lite-J7-Android8.apk
          cp dist/X-Lite-J7-Android8.apk dist/sai/base.apk

          python3 - <<'PY'
          import json
          import time
          from pathlib import Path

          now = int(time.time() * 1000)
          apk_size = Path("dist/sai/base.apk").stat().st_size

          meta_v1 = {
              "export_timestamp": now,
              "label": "X Lite",
              "package": "com.ximbica.xlite",
              "version_code": 1,
              "version_name": "0.1.0"
          }

          meta_v2 = {
              "backup_components": [
                  {"size": apk_size, "type": "apk_files"}
              ],
              "export_timestamp": now,
              "split_apk": False,
              "label": "X Lite",
              "meta_version": 2,
              "min_sdk": 26,
              "package": "com.ximbica.xlite",
              "target_sdk": 35,
              "version_code": 1,
              "version_name": "0.1.0"
          }

          Path("dist/sai/meta.sai_v1.json").write_text(
              json.dumps(meta_v1, separators=(",", ":")),
              encoding="utf-8"
          )
          Path("dist/sai/meta.sai_v2.json").write_text(
              json.dumps(meta_v2, separators=(",", ":")),
              encoding="utf-8"
          )
          PY

          (
            cd dist/sai
            zip -9 ../X-Lite-J7-Android8.apks base.apk meta.sai_v1.json meta.sai_v2.json
          )

      - name: Upload install packages
        uses: actions/upload-artifact@v4
        with:
          name: X-Lite-J7-Android8
          path: |
            dist/X-Lite-J7-Android8.apk
            dist/X-Lite-J7-Android8.apks
          if-no-files-found: error
          retention-days: 30
