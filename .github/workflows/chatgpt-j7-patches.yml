name: Build GPT J7 patches

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt-j7-revanced
    paths:
      - 'chatgpt-j7-revanced/**'
      - '.github/workflows/chatgpt-j7-patches.yml'

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: chatgpt-j7-revanced
        run: gradle clean build --stacktrace

      - name: Upload patch build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-j7-revanced-patches
          if-no-files-found: warn
          path: |
            chatgpt-j7-revanced/patches/build/**
            chatgpt-j7-revanced/extensions/**/build/**
