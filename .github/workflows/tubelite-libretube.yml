name: Build TubeLite LibreTube Base

on:
  push:
    branches: [tubelite-libretube-base]
    paths:
      - 'TubeLiteLibre/**'
      - '.github/workflows/tubelite-libretube.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout TubeLite patches
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone pinned LibreTube
        shell: bash
        run: |
          git clone https://github.com/libre-tube/LibreTube.git LibreTube
          cd LibreTube
          git checkout 69ca0ba5de14cbb391839ddb30fa4da35e8b2283
          git submodule update --init --recursive || true

      - name: Apply TubeLite patches
        run: python3 TubeLiteLibre/apply_patches.py LibreTube

      - name: Build Android 8 unsigned release APK
        working-directory: LibreTube
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Prepare unsigned release APK
        shell: bash
        run: |
          APK="$(find LibreTube/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" TubeLite-J7-LibreBase-v0.4.0-Android8-unsigned.apk
          ls -lh TubeLite-J7-LibreBase-v0.4.0-Android8-unsigned.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeLite-J7-LibreBase-Unsigned
          path: TubeLite-J7-LibreBase-v0.4.0-Android8-unsigned.apk
          if-no-files-found: error
          retention-days: 30
