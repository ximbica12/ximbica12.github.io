name: Build GPTLewd Web APK

on:
  push:
    branches:
      - gptlewd-web
    paths:
      - 'gptlewd-web/**'
      - '.github/workflows/build-gptlewd-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: gptlewd-web
        run: gradle :app:assembleDebug --stacktrace

      - name: APK checksum
        working-directory: gptlewd-web
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPTLewd-Web-J7-alpha1
          path: |
            gptlewd-web/app/build/outputs/apk/debug/app-debug.apk
            gptlewd-web/app-debug.sha256
          if-no-files-found: error
          retention-days: 30
