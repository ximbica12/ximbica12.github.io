name: Build XLite v0.5 GeckoView

on:
  push:
    branches:
      - xlite-apk-build
    paths:
      - 'xlite-build/**'
      - '.github/workflows/xlite-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          else
            test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
            test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          fi

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release unsigned
        working-directory: xlite-build
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Zipalign unsigned APK
        run: |
          IN="xlite-build/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="XLite-for-X-v0.5-Android8-ARMv7-unsigned-aligned.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$IN" "$OUT"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -v 4 "$OUT"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: XLite-for-X-v0.5-GeckoView-unsigned
          path: XLite-for-X-v0.5-Android8-ARMv7-unsigned-aligned.apk
          if-no-files-found: error
