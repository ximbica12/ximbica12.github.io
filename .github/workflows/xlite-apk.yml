name: Build XLite Gecko v0.6 Recovery

on:
  push:
    branches:
      - xlite-apk-build
    paths:
      - 'xlite-build/**'
      - '.github/workflows/xlite-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 37.1
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-37.1" "build-tools;36.0.0"
          else
            test -f "$ANDROID_SDK_ROOT/platforms/android-37.1/android.jar"
            test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          fi

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build signed debug APK
        working-directory: xlite-build
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp xlite-build/app/build/outputs/apk/debug/app-debug.apk XLite-Gecko-v0.6-Android8-ARMv7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XLite-Gecko-v0.6-Recovery
          path: XLite-Gecko-v0.6-Android8-ARMv7.apk
          if-no-files-found: error
