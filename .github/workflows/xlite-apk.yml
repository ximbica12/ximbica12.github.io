name: Build XLite APK

on:
  push:
    branches:
      - xlite-apk-build
    paths:
      - 'xlite-build/**'
      - '.github/workflows/xlite-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: xlite-build
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp xlite-build/app/build/outputs/apk/debug/app-debug.apk XLite-for-X-Android8-ARMv7-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XLite-for-X-Android8-ARMv7
          path: XLite-for-X-Android8-ARMv7-debug.apk
          if-no-files-found: error
