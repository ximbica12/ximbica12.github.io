name: Build Jiggle Physics APK

on:
  push:
    branches:
      - jiggle-physics-app-v1
    paths:
      - "jiggle-physics-android/**"
      - ".github/workflows/build-jiggle-physics-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jiggle-physics-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JigglePhysicsLab-debug
          path: jiggle-physics-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
