name: Build Jiggle Physics APK

on:
  push:
    branches:
      - jiggle-physics-app-v3
    paths:
      - "jiggle-physics-android/**"
      - ".github/workflows/build-jiggle-physics-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jiggle-physics-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Bundle lightweight VRoid and renderer
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets/vendor app/src/main/assets/models
          curl -L --fail --retry 3 -o app/src/main/assets/vendor/three.min.js             https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js
          curl -L --fail --retry 3 -o app/src/main/assets/vendor/GLTFLoader.js             https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js
          rm -f app/src/main/assets/vendor/three-vrm.js
          curl -L --fail --retry 3 -o app/src/main/assets/models/female.vrm             https://raw.githubusercontent.com/madjin/vrm-samples/master/vroid/fem_vroid.vrm
          ls -lh app/src/main/assets/vendor app/src/main/assets/models

      - name: Inspect lightweight rig
        run: python3 tools/inspect_vrm.py app/src/main/assets/models/female.vrm | tee /tmp/rig.txt

      - name: Verify required Bust bones
        run: |
          grep -q "J_Sec_L_Bust1" /tmp/rig.txt
          grep -q "J_Sec_R_Bust1" /tmp/rig.txt
          grep -q "spring bone groups 1" /tmp/rig.txt

      - name: Validate runtime JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          blocks=re.findall(r"<script>(.*?)</script>",html,re.S)
          Path("/tmp/runtime.js").write_text("\n".join(blocks),encoding="utf-8")
          PY
          node --check /tmp/runtime.js

      - name: Ensure heavy VRM runtime is absent
        run: |
          test ! -f app/src/main/assets/vendor/three-vrm.js
          ! grep -q "three-vrm.js" app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MilfJiggleLab-v3-J7-optimized
          path: jiggle-physics-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
