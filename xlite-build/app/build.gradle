plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xlite.browser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xlite.browser.debug'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.4.1'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.0'
}
