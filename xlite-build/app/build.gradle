plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xlite.browser'
    compileSdk 36

    defaultConfig {
        applicationId 'com.xlite.browser.debug'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.5.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview-armeabi-v7a:156.0.20260909172920'
}
