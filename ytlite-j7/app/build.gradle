plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ximbica.ytlite'
    compileSdk 36

    defaultConfig {
        applicationId "com.ximbica.ytlite"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
        ndk {
            abiFilters "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/NOTICE",
                "META-INF/NOTICE.txt"
            ]
        }
    }
}

dependencies {
    // GeckoView 153 keeps official Android 8 / armeabi-v7a support.
    def geckoviewVersion = "153.0.20260730155536"
    implementation "org.mozilla.geckoview:geckoview-armeabi-v7a:$geckoviewVersion"
}
