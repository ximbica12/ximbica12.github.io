<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>NexoTube TV</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="brand">
        <img src="icon.png" alt="">
        <span>NexoTube</span>
      </div>
      <button class="nav-item focusable active" data-view="home">Início</button>
      <button class="nav-item focusable" data-view="search">Buscar</button>
      <button class="nav-item focusable" data-view="subscriptions">Inscrições</button>
      <button class="nav-item focusable" data-view="library">Biblioteca</button>
      <button class="nav-item focusable" data-view="profiles">Perfis</button>
      <button class="nav-item focusable" data-view="settings">Configurações</button>
      <div id="profile-badge"></div>
    </aside>

    <main id="content">
      <header id="topbar">
        <div>
          <h1 id="view-title">Início</h1>
          <p id="view-subtitle">Descoberta independente e privada</p>
        </div>
        <div id="status">NexoTube TV</div>
      </header>
      <div id="screen"></div>
    </main>

    <div id="player-overlay" class="hidden">
      <video id="video-player" playsinline></video>
      <div id="player-shade"></div>
      <div id="player-info">
        <h2 id="player-title"></h2>
        <p id="player-meta"></p>
        <div class="player-actions">
          <button id="btn-subscribe" class="focusable">Inscrever-se</button>
          <button id="btn-watchlater" class="focusable">Assistir mais tarde</button>
          <button id="btn-close-player" class="focusable">Voltar</button>
        </div>
      </div>
      <div id="player-message"></div>
    </div>

    <div id="dialog" class="hidden">
      <div class="dialog-card">
        <h2 id="dialog-title"></h2>
        <div id="dialog-body"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
